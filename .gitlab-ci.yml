.deploy_api_stage:
  stage: deploy
  only:
    - develop
  except:
    - schedules
  environment:
    name: stage
    url: https://adios-stage.orr.noaa.gov
    on_stop: stop_api_stage
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:adios-db-web-api-dbg
    CONTAINER_NAME: adios_db_web_api
    APP_NETWORK: adios_net
    PORT_MAPPING: 127.0.0.1:8084:9898
    REPO_VOLUME: noaa_data_repo
    KC_CONFIG_VOLUME: adiosdb_kc_config
    GIT_STRATEGY: none
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      docker network inspect $APP_NETWORK >/dev/null 2>&1 || docker network
      create -d bridge $APP_NETWORK
    - >
      docker volume inspect $REPO_VOLUME >/dev/null 2>&1 || docker volume create
      $REPO_VOLUME
    - >
      docker volume inspect $KC_CONFIG_VOLUME >/dev/null 2>&1 || docker volume
      create $KC_CONFIG_VOLUME
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME
    - >
      docker run -d -p $PORT_MAPPING --name $CONTAINER_NAME -e
      MONGODB_WRITEABLE=true -e REFRESH_INTERNAL_DB=$REFRESH_INTERNAL_DB
      --network $APP_NETWORK -v $REPO_VOLUME:/data/git_repos -v
      $KC_CONFIG_VOLUME:/data/kc_config --restart unless-stopped $IMAGE_TAG
    - docker ps
    - docker logs $CONTAINER_NAME
  tags:
    - adios-stage
    - deploy

.stop_api_stage:
  stage: deploy
  only:
    - develop
  when: manual
  environment:
    name: stage
    action: stop
  variables:
    GIT_STRATEGY: none
    CONTAINER_NAME: adios_db_web_api
  script:
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME
  tags:
    - adios-stage
    - deploy

.deploy_oauth_api_stage:
  stage: deploy
  only:
    - develop
  except:
    - schedules
  environment:
    name: stage
    url: https://adios-stage.orr.noaa.gov
    on_stop: stop_oauth_api_stage
  variables:
    IMAGE_TAG: registry.orr.noaa.gov/it/oauth2-proxy:master
    CONTAINER_NAME: auth_web_api
    APP_NETWORK: adios_net
    PORT_MAPPING: 8004:4180
    OAUTH2_PROXY_PROVIDER: keycloak-oidc
    OAUTH2_PROXY_CLIENT_ID: adios
    OAUTH2_PROXY_REDIRECT_URL: https://adios-stage.orr.noaa.gov/oauth2/callback
    OAUTH2_PROXY_OIDC_ISSUER_URL: https://sso.orr.noaa.gov/realms/ORR
    OAUTH2_PROXY_EMAIL_DOMAINS: noaa.gov
    OAUTH2_PROXY_UPSTREAMS: http://adios_db_web_api:9898
    OAUTH2_PROXY_COOKIE_DOMAIN: https://adios-stage.orr.noaa.gov
    OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    #OAUTH2_PROXY_ALLOWED_ROLES: <OPTIONAL>
    KC_CONFIG_VOLUME: adiosdb_kc_config
    GIT_STRATEGY: none
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      docker network inspect $APP_NETWORK >/dev/null 2>&1 || docker network
      create -d bridge $APP_NETWORK
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME
    - >
      docker run -d -p $PORT_MAPPING --name $CONTAINER_NAME --network
      $APP_NETWORK --restart unless-stopped --env
      OAUTH2_PROXY_PROVIDER=$OAUTH2_PROXY_PROVIDER --env
      OAUTH2_PROXY_CLIENT_ID=$OAUTH2_PROXY_CLIENT_ID --env
      OAUTH2_PROXY_CLIENT_SECRET=$AUTH_SECRET --env
      OAUTH2_PROXY_COOKIE_SECRET=$AUTH_COOKIE_SECRET --env
      OAUTH2_PROXY_REDIRECT_URL=$OAUTH2_PROXY_REDIRECT_URL --env
      OAUTH2_PROXY_OIDC_ISSUER_URL=$OAUTH2_PROXY_OIDC_ISSUER_URL --env
      OAUTH2_PROXY_EMAIL_DOMAINS=$OAUTH2_PROXY_EMAIL_DOMAINS --env
      OAUTH2_PROXY_UPSTREAMS=$OAUTH2_PROXY_UPSTREAMS --env
      OAUTH2_PROXY_COOKIE_DOMAIN=$OAUTH2_PROXY_COOKIE_DOMAIN --env
      OAUTH2_PROXY_HTTP_ADDRESS=$OAUTH2_PROXY_HTTP_ADDRESS --env
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true --env
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR=/data/kc_config --env
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO=/data/kc_config/NOAA_logo.svg -v
      $KC_CONFIG_VOLUME:/data/kc_config $IMAGE_TAG
  tags:
    - adios-stage
    - deploy

