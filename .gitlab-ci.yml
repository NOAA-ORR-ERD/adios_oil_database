variables:
  PYTHON_VER: '3.11'
  CI_APPLICATION_TAG: $CI_COMMIT_SHA-api-stage
  TF_DESTROY: 'false'
  MY_SERVER_ROLE_TAG: 'adios'
  TRAEFIK_IMAGE: '$SYSADMIN_CONTAINER_REGISTRY/sidecar-traefik/sidecar-traefik:1.1.2'

include:
  - component: $CI_SERVER_FQDN/components/build-publish-docker-image/BuildPublishContainerRegistryImage@v3.0.0
    rules:
      - if: $TF_DESTROY == "true" # Do not run when TF_DESTROY is true
        when: never
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Do not run this job for merge requests
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline" # Do not run this job for pipelines
        when: never
      - if: $CI_COMMIT_REF_NAME
    inputs:
      before-script:
        - mv $ADIOS_STAGE_CONTAINER_KEY ./web_api/key # Move the production key file to the correct location before building the image.
        - git clone
          https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git
      job-name: 'Build Debug ADIOS API Image' # (Optional) The name of the GitLab job. If not specified then `BuildDockerImage` is used.
      stage: build # Specifies the pipeline stage (e.g., build, test, deploy) where the component will run
      build-args: # (Optional) Docker build arguments passed to the Dockerfile during the build
        - KEY_FILE=./web_api/key # Path to the key file used for authentication, relative to the repository root.
        - PYTHON_VER=$PYTHON_VER # Python version to be used in the Docker image.
      version: $CI_COMMIT_REF_NAME # (Optional) Specifies the image version, following semantic versioning. If the version is not specified, then `0.0.0-build.${CI_COMMIT_SHORT_SHA}` is used.
      image-name: 'adios-api-debug' # The name of the Docker image to be built and published. The CI_REGISTRY_IMAGE path is added through the job.
      dockerfile-path: ./web_api/dockerfile # Relative path to the Dockerfile in your repository. Useful if your Dockerfile is in a non-standard location.
      latest: true
  - component: $CI_SERVER_FQDN/components/build-publish-docker-image/BuildPublishContainerRegistryImage@v3.0.0
    rules:
      - if: $TF_DESTROY == "true" # Do not run when TF_DESTROY is true
        when: never
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Do not run this job for merge requests
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline" # Do not run this job for pipelines
        when: never
      - if: $CI_COMMIT_REF_NAME
    inputs:
      before-script:
        - mv $ADIOS_STAGE_CONTAINER_KEY ./web_api/key # Move the production key file to the correct location before building the image.
        - git clone
          https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git
      job-name: 'Build ADIOS API Image' # (Optional) The name of the GitLab job. If not specified then `BuildDockerImage` is used.
      stage: build # Specifies the pipeline stage (e.g., build, test, deploy) where the component will run
      build-args: # (Optional) Docker build arguments passed to the Dockerfile during the build
        - KEY_FILE=./web_api/key # Path to the key file used for authentication, relative to the repository root.
        - PYTHON_VER=$PYTHON_VER # Python version to be used in the Docker image.
      version: $CI_COMMIT_REF_NAME # (Optional) Specifies the image version, following semantic versioning. If the version is not specified, then `0.0.0-build.${CI_COMMIT_SHORT_SHA}` is used.
      image-name: 'adios-api' # The name of the Docker image to be built and published. The CI_REGISTRY_IMAGE path is added through the job.
      dockerfile-path: ./web_api/dockerfile_prod # Relative path to the Dockerfile in your repository. Useful if your Dockerfile is in a non-standard location.
      latest: true
  - component: $CI_SERVER_FQDN/components/build-publish-docker-image/BuildPublishContainerRegistryImage@v3.0.0
    rules:
      - if: $TF_DESTROY == "true" # Do not run when TF_DESTROY is true
        when: never
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Do not run this job for merge requests
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline" # Do not run this job for pipelines
        when: never
      - if: $CI_COMMIT_REF_NAME
    inputs:
      before-script:
        - git clone
          https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git
      job-name: 'Build debug ADIOS client Image' # (Optional) The name of the GitLab job. If not specified then `BuildDockerImage` is used.
      stage: build # Specifies the pipeline stage (e.g., build, test, deploy) where the component will run
      version: $CI_COMMIT_REF_NAME # (Optional) Specifies the image version, following semantic versioning. If the version is not specified, then `0.0.0-build.${CI_COMMIT_SHORT_SHA}` is used.
      image-name: 'adios-client-dbg' # The name of the Docker image to be built and published. The CI_REGISTRY_IMAGE path is added through the job.
      dockerfile-path: ./web_client/dockerfile # Relative path to the Dockerfile in your repository. Useful if your Dockerfile is in a non-standard location.
      latest: true
  - component: $CI_SERVER_FQDN/components/build-publish-docker-image/BuildPublishContainerRegistryImage@v3.0.0
    rules:
      - if: $TF_DESTROY == "true" # Do not run when TF_DESTROY is true
        when: never
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Do not run this job for merge requests
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline" # Do not run this job for pipelines
        when: never
      - if: $CI_COMMIT_REF_NAME
    inputs:
      before-script:
        - git clone
          https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git
      job-name: 'Build ADIOS client Image' # (Optional) The name of the GitLab job. If not specified then `BuildDockerImage` is used.
      stage: build # Specifies the pipeline stage (e.g., build, test, deploy) where the component will run
      version: $CI_COMMIT_REF_NAME # (Optional) Specifies the image version, following semantic versioning. If the version is not specified, then `0.0.0-build.${CI_COMMIT_SHORT_SHA}` is used.
      image-name: 'adios-client' # The name of the Docker image to be built and published. The CI_REGISTRY_IMAGE path is added through the job.
      dockerfile-path: ./web_client/dockerfile_prod # Relative path to the Dockerfile in your repository. Useful if your Dockerfile is in a non-standard location.
      latest: true
  - component: $CI_SERVER_FQDN/components/docker-compose/DockerCompose@v1.0.2
    inputs:
      job-name: 'Deploy Dev'
      action: 'deploy'
      server-role-tag: $MY_SERVER_ROLE_TAG
      docker-compose-file-path: './docker/docker-compose.yml'
      environment-name: 'dev'
      log-level: 'debug'
      deployment-target: 'vmware'
      docker-compose-pull-images: true
      docker-compose-environment-variables:
        - SIDECAR_TRAEFIK_IMAGE=$TRAEFIK_IMAGE
        - CLIENT_IMAGE=$CI_REGISTRY_IMAGE/adios-client-debug:$CI_COMMIT_REF_NAME
        - API_IMAGE=$CI_REGISTRY_IMAGE/adios-api-debug:$CI_COMMIT_REF_NAME

stages:
  - pre-test
  - build
  - verify
  - deploy_db
  - deploy
  - test
  - maintenance

test_develop:
  stage: pre-test
  image: registry.orr.noaa.gov/erd/environments/ubuntu/ubuntuforge-python$PYTHON_VER
  #  image: registry.orr.noaa.gov/erd/centos-conda/ubuntu/ubuntuforge-python$PYTHON_VER
  tags:
    - docker
    - linux

  except:
    - schedules

  before_script:
    - apt update
    - apt upgrade -y

    # mongod fails if the tzdata package is missing
    - echo 'tzdata tzdata/Areas select America' | debconf-set-selections
    - echo 'tzdata tzdata/Zones/America select Los_Angeles' |
      debconf-set-selections
    - DEBIAN_FRONTEND="noninteractive" apt install -y tzdata

  script:
    # install all the requirements
    - >
      conda install -y python=$PYTHON_VER --file adios_db/conda_requirements.txt
      --file adios_db/conda_requirements_optional.txt --file
      adios_db/conda_requirements_test.txt --file web_api/conda_requirements.txt

    # configure and start mongodb

    # mongo should have been installed by conda, but conda doesn't reserve
    # places for the logs, the database, and the pidfile
    # note: maybe we should update the test config so we don't need this??
    #       and then we could save the logs, etc as an artifact as well.
    - mkdir /var/lib/mongo
    - mkdir /var/log/mongodb
    - mkdir /var/run/mongodb

    # We can start the docker container manually like this:
    #   docker run --volume $(pwd)/git_repos/oil_database:/oil_database -it registry.orr.noaa.gov/erd/environments/ubuntu/ubuntuforge-python3.11 /bin/bash

    - mongod --config mongo_config_test.yml &

    # apt-get install -y lsof
    # lsof -nP -iTCP -sTCP:LISTEN  # see if mongod is listening

    # Install & test the adios_db package
    - cd adios_db
    - pip install ./
    - pytest --mongo --import adios_db/test

    # Install & test the adios_db_api package
    - cd ../web_api
    - pip install ./
    - pytest adios_db_api/tests

.Build Dev Server:
  stage: build
  needs: []
  variables:
    # Basic metadata for Terraform.
    TF_VAR_line_office: NOS
    TF_VAR_division: ERD
    TF_VAR_program: ORR
    TF_VAR_program_manager: 'amy.macfadyen@noaa.gov'
    TF_VAR_system_owner_name: 'James Makela'
    TF_VAR_system_owner_email: 'james.makela@noaa.gov'
    TF_VAR_vm_template_name: $GLOBAL_REDHAT_BASELINE_STABLE
    TF_VAR_role_tag: '$MY_SERVER_ROLE_TAG'
    TF_STATE_NAME: 'Development' # (LEAVE ME)
    TF_VAR_environment_tag: 'Development' # (LEAVE ME) Case-sensitive; indicates where your server deploys.
    TF_VAR_application_name: 'adios-dev' # (CHANGE ME) Used as a tag and part of the server name. Include -dev as a suffix.
    TF_VAR_instance_count: 1 # (LEAVE ME) Usually 1 unless a system admin instructs otherwise.
    TF_VAR_vm_data_disk_size: 100 # (LEAVE or CHANGE ME) The "data" disk for Docker volumes and data.
    TF_VAR_vm_disk_size: 100 # (LEAVE ME) The root volume size, typically enough for most uses.
    TF_ROOT: 'terraform/vmware' # (LEAVE ME) Points Terraform to the correct directory.
    TF_VAR_vm_cpu_cores_per_socket: 1 # (LEAVE or CHANGE ME) CPU cores per socket.
    TF_VAR_vm_cpu_cores: 6 # (LEAVE or CHANGE ME) Total CPU sockets.
    TF_VAR_vm_memory: 8192 # (LEAVE or CHANGE ME) Amount of RAM. Typically 2GB or 4GB is enough.

  trigger:
    forward:
      pipeline_variables: true
    strategy: depend # (LEAVE ME)
    include:
      - project: templates/developer-ci-templates # (LEAVE ME)
        ref: latest # (LEAVE ME)
        file: 'jobs/terraform/terraform.vm.gitlab-ci.yml' # (LEAVE ME)

.build_api:
  stage: build
  tags:
    - build
  except:
    - schedules
  variables:
    # URI format: <hostname>/<group>/<subgroup>/<project>/<module-name>
    # Should be something like: registry.orr.noaa.gov/gnome/oil_database/oil_database/api
    IMAGE_TAG_DBG: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:adios-db-web-api-dbg
    IMAGE_TAG_PROD: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:adios-db-web-api
  before_script:
    - mv $ADIOS_STAGE_CONTAINER_KEY ./web_api/key
  script:
    - git clone
      https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build . -f web_api/dockerfile -t $IMAGE_TAG_DBG --build-arg
      KEY_FILE="./web_api/key" --build-arg PYTHON_VER=$PYTHON_VER

    # apparently there is a timeout on the docker session, so we re-login
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG_DBG

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build . -f web_api/dockerfile_prod -t $IMAGE_TAG_PROD --build-arg
      KEY_FILE="./web_api/key" --build-arg PYTHON_VER=$PYTHON_VER

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG_PROD

.build_client:
  stage: build
  tags:
    - build
  except:
    - schedules
  variables:
    # Should be something like: registry.orr.noaa.gov/gnome/oil_database/oil_database/client
    IMAGE_TAG_DBG: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:adios-db-web-client-dbg
    IMAGE_TAG_PROD: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:adios-db-web-client
  script:
    - git clone
      https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build . -f web_client/dockerfile -t $IMAGE_TAG_DBG

    # apparently there is a timeout on the docker session, so we re-login
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG_DBG

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build . -f web_client/dockerfile_prod -t $IMAGE_TAG_PROD

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG_PROD

.deploy_mongodb_stage:
  stage: deploy_db
  only:
    - develop
  except:
    - schedules
  environment:
    name: stage
    url: https://adios-stage.orr.noaa.gov
    on_stop: stop_mongodb_stage
  variables:
    IMAGE_TAG: mongo:4.4.6
    CONTAINER_NAME: mongodb
    APP_NETWORK: adios_net
    PORT_MAPPING: 127.0.0.1:27017:27017
    DB_VOLUME: dbdata
    GIT_STRATEGY: none
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      docker network inspect $APP_NETWORK >/dev/null 2>&1 || docker network
      create -d bridge $APP_NETWORK
    - >
      docker volume inspect $DB_VOLUME >/dev/null 2>&1 || docker volume create
      $DB_VOLUME
    - docker pull $IMAGE_TAG
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME
    # The volume permissions are important here, so we need to set a user:group
    # when starting the container.
    # Right now they are set to james.makela:adios-dev so developers can manage
    # the volume external to the docker container.  We will need to change this
    # on the public server.
    - >
      docker run -d -p $PORT_MAPPING --name $CONTAINER_NAME --network
      $APP_NETWORK -v $DB_VOLUME:/data/db --restart unless-stopped $IMAGE_TAG
  tags:
    - adios-stage
    - deploy

.stop_mongodb_stage:
  stage: deploy_db
  when: manual
  only:
    - develop
  environment:
    name: stage
    action: stop
  variables:
    GIT_STRATEGY: none
    CONTAINER_NAME: mongodb
  script:
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME
  tags:
    - adios-stage
    - deploy

