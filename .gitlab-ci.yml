.deploy_proxy_public:
  stage: deploy
  only:
    - production
  environment:
    name: public
    url: https://adios.orr.noaa.gov
    on_stop: stop_proxy_public
  variables:
    IMAGE_TAG: nginx
    CONTAINER_NAME: adios_db_web_proxy
    APP_NETWORK: adios_net
    PORT_MAPPING1: 443:443
    PORT_MAPPING2: 80:80
    OILDB_PROJ_FOLDER: /data/adios_oil_db/oildb-deploy
    GIT_STRATEGY: none
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      docker network inspect $APP_NETWORK >/dev/null 2>&1 || docker network
      create -d bridge $APP_NETWORK
    - docker pull $IMAGE_TAG
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME

    - if [ -d $OILDB_PROJ_FOLDER ]; then rm -rf $OILDB_PROJ_FOLDER; fi
    - git clone
      https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/oil_database/oildb-deploy.git
      $OILDB_PROJ_FOLDER
    - chmod go+rw $OILDB_PROJ_FOLDER/config/public/proxy/*
    - >
      chmod go+rx $OILDB_PROJ_FOLDER $OILDB_PROJ_FOLDER/config
      $OILDB_PROJ_FOLDER/config/public $OILDB_PROJ_FOLDER/config/public/proxy

    - ls -la $OILDB_PROJ_FOLDER
    - ls -la $OILDB_PROJ_FOLDER/config/public/proxy
    - ls -la /etc/ssl/certs/*
    - >
      docker run -d --name $CONTAINER_NAME --network $APP_NETWORK --restart
      unless-stopped -p $PORT_MAPPING1 -p $PORT_MAPPING2 -v
      $OILDB_PROJ_FOLDER/config/public/proxy:/etc/nginx/ -v
      /etc/ssl/certs:/etc/ssl/certs $IMAGE_TAG
  tags:
    - adios-prod
    - deploy

.stop_proxy_public:
  stage: deploy
  only:
    - production
  when: manual
  environment:
    name: public
    action: stop
  variables:
    GIT_STRATEGY: none
    CONTAINER_NAME: adios_db_web_proxy
  script:
    - docker stop $CONTAINER_NAME && docker container rm --volumes
      $CONTAINER_NAME
  tags:
    - adios-prod
    - deploy

